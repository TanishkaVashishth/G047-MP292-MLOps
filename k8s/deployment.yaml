apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp292-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp292-api
  template:
    metadata:
      labels:
        app: mp292-api
    spec:
      containers:
        - name: api
          image: mp292-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
