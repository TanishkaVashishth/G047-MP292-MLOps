data:
  train_path: data/raw/train.csv
  later_path: data/raw/later.csv
  holdout_path: data/raw/holdout_features.csv
  target: litres_per_day
  leakage_column: litres_paid_in_passbook
  stuck_sensor:
    column: buffaloes
    value: 114
    start_date: '2026-03-12'
    end_date: '2026-03-28'
seed: 42
split:
  test_size: 0.2
models:
  random_forest_baseline:
    estimator: RandomForestRegressor
    n_estimators: 200
    max_depth: null
    min_samples_leaf: 2
  random_forest_tuned:
    estimator: RandomForestRegressor
    n_estimators: 400
    max_depth: 12
    min_samples_leaf: 3
  extra_trees:
    estimator: ExtraTreesRegressor
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
experiment_name: MP292_Village_Milk_Collection
mlflow_tracking_uri: sqlite:///mlflow.db
registered_model_name: MP292_Milk_Collection
model_output: models/model.joblib
